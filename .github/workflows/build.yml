name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
          cache-disabled: true

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        run: |
          APK_PATH="$(find .github/workflows/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK was not generated" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/RemoteTTS-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteTTS-debug
          path: artifacts/RemoteTTS-debug.apk
          if-no-files-found: error
